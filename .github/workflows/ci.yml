name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cli/package-lock.json
      - run: npm ci
      - run: npm ci --prefix cli
      - run: npm run lint
      # prebuild type-checks every component and fails on broken imports or unlisted folders
      - run: npm run build
      # installs every component x variant from the freshly built registry
      - run: npm test --prefix cli
